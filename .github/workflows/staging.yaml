name: Deploy to Staging

on:
  workflow_dispatch:

jobs:
  deploy_and_test_staging:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        env:
          WIF_POOL_ID: ${{ secrets.WIF_POOL_ID }}
        if: env.WIF_POOL_ID != ''
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID }}

      - name: Set up Cloud SDK
        env:
          WIF_POOL_ID: ${{ secrets.WIF_POOL_ID }}
        if: env.WIF_POOL_ID != ''
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'beta'

      - name: Install dependencies
        run: rm -f uv.lock && uv sync --all-groups

      - name: Deploy to Staging (Agent Runtime)
        env:
          WIF_POOL_ID: ${{ secrets.WIF_POOL_ID }}
        run: |
          if [ -n "$WIF_POOL_ID" ]; then
            uvx google-agents-cli@1.4.0 deploy \
              --project ${{ vars.STAGING_PROJECT_ID }} \
              --region ${{ vars.REGION }} \
              --service-account=${{ vars.APP_SERVICE_ACCOUNT_STAGING }} \
              --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=${{ github.sha }},LOGS_BUCKET_NAME=${{ vars.LOGS_BUCKET_NAME_STAGING }}"
          else
            echo "ℹ️ WIF_POOL_ID secret not configured. Skipping staging deployment."
          fi
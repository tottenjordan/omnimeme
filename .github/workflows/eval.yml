name: Agent Evaluation Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  agent-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv & agents-cli
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          uv tool install google-agents-cli

      - name: Install Dependencies
        run: rm -f uv.lock && uv sync --all-groups

      - name: Execute agents-cli Evaluation Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: "us-central1"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$GOOGLE_CLOUD_PROJECT" ]; then
            agents-cli eval run --dataset tests/eval/datasets/basic-dataset.json --config tests/eval/eval_config.yaml
          else
            echo "ℹ️ GEMINI_API_KEY / GOOGLE_CLOUD_PROJECT secret not configured. Skipping live LLM evaluation."
          fi
